version: '3.9'

# docker-compose.yml — ELDOM CORPORATION ERP
#
# USO RECOMENDADO (modo desarrollo local):
#   docker-compose up -d postgres           # solo la base de datos
#   cd backend  && npm install && npm run migrate && npm run seed && npm run dev
#   cd frontend && npm install && npm run dev
#
# Los servicios `backend` y `frontend` quedan disponibles si prefieres correr todo
# en contenedores (docker-compose up), pero el flujo habitual es levantar
# Postgres en Docker y los dos procesos node nativos.

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_eldom_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_eldom
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_eldom"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: erp_eldom_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_eldom
      DB_USER: erp_admin
      DB_PASSWORD: erp_secret_2024
      JWT_SECRET: dev_only_jwt_secret_replace_in_production_with_min_64_chars_of_real_randomness_xxxxxxxxxxxxxxxx
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: erp_eldom_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
