# ============================================================================
# nginx.erp-eldom.conf
# Reverse proxy de producción para el ERP ELDOM CORPORATION.
#
# Asunciones:
#   * TLS termina en este nginx (certificados vía Let's Encrypt / certbot).
#   * El frontend (dist/ de Vite) se sirve estático desde /var/www/erp-eldom.
#   * El backend escucha HTTP en 127.0.0.1:4000 (NO expuesto a internet).
#   * La política de CORS la impone el backend; aquí sólo añadimos cabeceras HTTP.
# ============================================================================

upstream erp_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── Redirección 80 → 443 ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name erp.eldomcorp.com;

    # ACME challenge para renovación de certificado
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── TLS principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.eldomcorp.com;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/erp.eldomcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.eldomcorp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras defensivas — complementan las que pone helmet en el backend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff"    always;
    add_header Referrer-Policy            "no-referrer" always;

    # Tamaños / timeouts conservadores
    client_max_body_size 2m;      # backend ya limita a 1mb; este es el techo nginx.
    client_body_timeout  15s;
    send_timeout         15s;

    # ── Frontend estático (build de Vite) ───────────────────────────────────
    root /var/www/erp-eldom;
    index index.html;

    # Cache agresivo para assets hasheados por Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — cualquier ruta no-API sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ── Health & Readiness (internos) ────────────────────────────────────────
    # /health respondido directamente por el backend. Útil para monitoreo externo.
    location = /health {
        proxy_pass http://erp_backend/health;
        access_log off;
    }
    # /ready es para el balanceador / orquestador. Si quiere mantenerlo privado,
    # restrinja por IP (ejemplo: allow 10.0.0.0/8; deny all;).
    location = /ready {
        proxy_pass http://erp_backend/ready;
        access_log off;
    }
}
